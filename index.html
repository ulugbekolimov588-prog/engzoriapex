  <a class="tile wide" href="#dokon"><h3 style="font-size:44px">Doʻkon</h3><p>Ranklar, tokenlar va kalitlar</p><span class="go">Doʻkonni ochish →</span></a>
  <div class="tile"><span class="lbl">HAMJAMIYAT</span><h3>Jamoangiz shu yerda.</h3><p>Yangiliklar, suhbat va yangi doʻstlar.</p>
  <p style="margin-top:auto"><a href="https://t.me/${CONFIG.telegram}" target="_blank" rel="noopener" style="color:var(--text)">Telegram ↗</a> &nbsp; <a href="${CONFIG.discord}" target="_blank" rel="noopener" style="color:var(--text)">Discord ↗</a></p></div>
  <div class="tile"><p>IPʼni nusxalash</p><h3 style="color:var(--gold)">${CONFIG.ip}</h3><button class="btn sm" id="h3" type="button" style="margin-top:auto;align-self:flex-start">Nusxalash</button></div>
  <a class="tile wide" href="#serverlar" style="min-height:0;flex-direction:row;align-items:center"><div><h3 style="font-size:22px;letter-spacing:-.01em">Qanday qoʻshilaman?</h3><p>Minecraft Javaʼni oching, manzilni kiriting va ulaning.</p></div></a></div>`;
  ["h1", "h2", "h3"].forEach(id => $(id).onclick = e => copy(CONFIG.ip, e.target));
}
function pageServers() {
  view.innerHTML = `<div class="page"><h2>Server</h2><p class="sub">Anarxiya rejimiga ulaning.</p><div class="srv" id="sv"></div>
  <div class="panel" style="margin-top:20px"><h3>Qanday ulanaman?</h3><p style="margin:0;color:var(--muted)">Minecraft Java ichida <b>Multiplayer</b> → <b>Add Server</b> bosing va manzilni kiriting: <b style="color:var(--gold)">${CONFIG.ip}</b></p></div></div>`;
  Object.values(CONFIG.modes).forEach(m => {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<h3>${m.name}</h3><p>${m.desc}</p><div class="meta"><span>Anarxiya</span><span>${CONFIG.version}</span></div><button class="btn gold" type="button">Oʻyinni boshlash</button>`;
    d.querySelector("button").onclick = e => copy(CONFIG.ip, e.target); $("sv").appendChild(d);
  });
}
function list() { return PRODUCTS.filter(p => p.cat === state.cat && (!p.modes || p.modes.includes(state.mode))); }
const minPrice = p => Math.min(...p.opts.map(o => o[1]));
function pageShop() {
  view.innerHTML = `<div class="page"><h2>Doʻkon</h2><p class="sub">Mahsulotni tanlang, nikingizni yozing va buyurtma bering.</p>
  <div class="seg" id="sm" role="group" aria-label="Rejim"></div><div class="seg" id="sc" role="group" aria-label="Toifa"></div>
  <div class="shop"><div class="panel"><h3>Mahsulotni tanlang:</h3><div id="ls"></div></div><div class="panel" id="dt" aria-live="polite"></div></div></div>`;
  drawSeg(); drawList(); drawDetail();
}
function drawSeg() {
  const mk = (host, entries, key, reset) => {
    host.innerHTML = "";
    entries.forEach(([k, label]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", state[key] === k);
      b.onclick = () => { state[key] = k; state.sel = 0; state.opt = 0; drawSeg(); drawList(); drawDetail(); }; host.appendChild(b);
    });
  };
  const multi = Object.keys(CONFIG.modes).length > 1; $("sm").style.display = multi ? "" : "none";
  if (multi) mk($("sm"), Object.entries(CONFIG.modes).map(([k, m]) => [k, m.name]), "mode");
  mk($("sc"), Object.entries(CATS), "cat");
}
function drawList() {
  const L = list(); $("ls").innerHTML = L.length ? "" : '<p style="color:var(--muted)">Bu boʻlimda hozircha mahsulot yoʻq.</p>';
  L.forEach((p, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "row"; b.setAttribute("aria-pressed", i === state.sel);
    b.innerHTML = `<span class="ic" style="--c:${p.color}"></span><span class="nm">${p.name}</span><span class="pr">${p.opts.length > 1 ? "dan " : ""}${fmt(minPrice(p))}</span>`;
    b.onclick = () => { state.sel = i; state.opt = 0; drawList(); drawDetail(); }; $("ls").appendChild(b);
  });
}
function perksHtml(p) {
  const r = p.rank;
  if (!r) return `<ul class="perks">${p.perks.map(x => `<li>${x}</li>`).join("")}</ul>`;
  const kit = [r.kit || "/kit " + p.name, p.name + (r.kit ? " kitlarini olish" : " kitini olish")];
  const st = [["Home", r.h + " ta"], ["Region", r.r + " blok"], ["Auksion", r.a + " slot"], ["Teleport", r.t]];
  const lower = p.name !== RANKS[0].n ? "<li>Quyi ranklarning barcha imkoniyatlari ham kiradi</li>" : "";
  return `<p class="pfx">Chat va tabda: <b>[${p.name}] Nikingiz</b></p>
  <div class="stats">${st.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("")}</div>
  <h4 class="ch">Buyruqlar</h4><ul class="cmds">${[kit, ...r.k].map(([c, d]) => `<li><code>${c}</code><span>${d}</span></li>`).join("")}</ul>
  <ul class="extras">${(r.x || []).map(x => `<li>${x}</li>`).join("")}${lower}</ul>`;
}
function drawDetail() {
  const p = list()[state.sel], dt = $("dt");
  if (!p) { dt.innerHTML = '<p style="color:var(--muted);margin:0">Mahsulot tanlang.</p>'; return; }
  const o = p.opts[state.opt];
  dt.innerHTML = `<div class="det-h"><span class="ic" style="--c:${p.color}"></span><h2>${p.name}</h2></div>
  ${perksHtml(p)}
  <label>${p.optLabel}</label><div class="opts" id="op"></div>
  <div class="tot"><span>Jami</span><span>${fmt(o[1])}</span></div>
  <label for="nick">Minecraft nikingiz</label><input type="text" id="nick" maxlength="16" autocomplete="off" placeholder="Masalan: Steve_UZ" value="${state.nick}">
  <button class="btn gold" id="go" type="button" style="width:100%;margin-top:14px">Buyurtma berish</button><div class="msg" id="msg" role="status"></div>`;
  p.opts.forEach((x, i) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", i === state.opt);
    b.innerHTML = `${x[0]}<small>${fmt(x[1])}</small>`; b.onclick = () => { state.opt = i; drawDetail(); }; $("op").appendChild(b);
  });
  $("nick").oninput = e => state.nick = e.target.value.trim();
  $("go").onclick = () => {
    const msg = $("msg"); msg.className = "msg"; msg.innerHTML = "";
    if (!/^[A-Za-z0-9_]{3,16}$/.test(state.nick)) { msg.className = "msg err"; msg.textContent = "Nik 3–16 belgi: lotin harflari, raqam va _ boʻlishi kerak."; return; }
    try { localStorage.setItem("nick", state.nick); } catch (e) {}
    const text = `Buyurtma\nNik: ${state.nick}\nRejim: ${CONFIG.modes[state.mode].name}\nMahsulot: ${p.name} (${o[0]})\nSumma: ${fmt(o[1])}`;
    msg.innerHTML = `<div>${fmt(o[1])} ni quyidagi kartaga oʻtkazing, soʻng chekni Telegramga yuboring. Admin tekshirib, mahsulotni nikingizga beradi.</div><div class="cardnum">${CONFIG.card}</div><div style="color:var(--muted)">${CONFIG.cardOwner} · ${CONFIG.bank}</div>`;
    const a = document.createElement("a"); a.className = "btn gold"; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Telegramga yuborish";
    a.href = `https://t.me/${CONFIG.telegram}?text=${encodeURIComponent(text)}`;
    const c = document.createElement("button"); c.type = "button"; c.className = "btn"; c.textContent = "Karta raqamini nusxalash";
    c.onclick = () => copy(CONFIG.card.replace(/\s/g, ""), c);
    msg.append(a, c);
  };
}
function pageRules() {
  view.innerHTML = `<div class="page"><h2>Qoidalar</h2><p class="sub">Oʻynashdan oldin oʻqib chiqing.</p><div class="panel"><ol class="rules" id="rl"></ol></div></div>`;
  CONFIG.rules.forEach(r => { const li = document.createElement("li"); li.textContent = r; $("rl").appendChild(li); });
}
function pageSupport() {
  view.innerHTML = `<div class="page"><h2>Support</h2><p class="sub">Toʻlov yoki mahsulot boʻyicha savol boʻlsa, yozing. Nikingizni koʻrsating.</p>
  <div class="btns"><a class="btn gold" target="_blank" rel="noopener" href="https://t.me/${CONFIG.telegram}">Telegram</a><a class="btn" target="_blank" rel="noopener" href="${CONFIG.discord}">Discord</a></div></div>`;
}
const PAGES = [["home", "Bosh sahifa", pageHome], ["serverlar", "Serverlar", pageServers], ["dokon", "Doʻkon", pageShop], ["qoidalar", "Qoidalar", pageRules], ["support", "Support", pageSupport]];
function route() {
  const r = (location.hash || "#home").slice(1), pg = PAGES.find(p => p[0] === r) || PAGES[0];
  $("nav").innerHTML = PAGES.map(p => `<a href="#${p[0]}"${p === pg ? ' aria-current="page"' : ""}>${p[1]}</a>`).join("");
  pg[2](); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
